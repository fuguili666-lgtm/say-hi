name: Daily WeCom Greeting

on:
  schedule:
    - cron: "30 1 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send greeting
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/send_wecom_greeting.py

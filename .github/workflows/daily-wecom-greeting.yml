name: Daily WeCom Greeting

on:
  schedule:
    # GitHub Actions cron uses UTC. 17:30 UTC is 01:30 next day in Asia/Shanghai.
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send greeting
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/send_wecom_greeting.py
